<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intentional YouTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #202020;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 14px;
      color: #666;
    }
    .search-box {
      background: #fff;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 32px;
    }
    .search-box label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .search-box textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
      margin-bottom: 12px;
    }
    .search-box button {
      padding: 12px 24px;
      border: none;
      background: #333;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }
    .search-box button:hover {
      background: #000;
    }
    .search-box button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    .pipeline-status {
      font-size: 13px;
      color: #666;
      margin-top: 12px;
      font-style: italic;
    }
    .summary-box {
      background: #f0f8ff;
      border: 1px solid #b3d9ff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 32px;
    }
    .summary-box h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .summary-box p {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
    }
    .export-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #b3d9ff;
    }
    .export-section textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      margin-bottom: 8px;
    }
    .export-section button {
      padding: 8px 16px;
      border: none;
      background: #0066cc;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .export-section button:hover {
      background: #0052a3;
    }
    .player {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 32px;
    }
    .player h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .player iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 4px;
    }
    .player-fallback {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
    }
    .player-fallback a {
      color: #0066cc;
    }
    .hidden {
      display: none;
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .result {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
    }
    .result-rank {
      display: inline-block;
      background: #333;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .result-title button {
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #0066cc;
      cursor: pointer;
      text-align: left;
      padding: 0;
      text-decoration: underline;
    }
    .result-title button:hover {
      color: #0052a3;
    }
    .meta {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }
    .reasoning {
      font-size: 13px;
      color: #555;
      margin-top: 8px;
      padding: 8px;
      background: #f9f9f9;
      border-left: 3px solid #0066cc;
      font-style: italic;
    }
    .desc {
      font-size: 14px;
      color: #444;
      margin-top: 8px;
      line-height: 1.5;
    }
    .toggle-all {
      text-align: center;
      margin: 24px 0;
    }
    .toggle-all button {
      padding: 10px 20px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .toggle-all button:hover {
      background: #f5f5f5;
    }
    .status {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin: 20px 0;
    }
    .api-setup {
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      padding: 16px;
      margin-top: 40px;
      font-size: 13px;
    }
    .api-setup label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }
    .api-key-row {
      margin-bottom: 16px;
    }
    .api-setup input[type="password"] {
      width: 70%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      margin-right: 8px;
    }
    .api-setup button {
      padding: 8px 16px;
      border: none;
      background: #0066cc;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .api-setup button:hover {
      background: #0052a3;
    }
    .quiet-link {
      color: #666;
      text-decoration: none;
    }
    .quiet-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Intentional YouTube</h1>
    <p class="tagline">Describe what you're looking for. Your algorithm, your rules.</p>
  </header>

  <div class="search-box">
    <label for="query">What are you looking for?</label>
    <textarea id="query" placeholder="Describe in detail what you're trying to learn or understand. Be specific about your goals, context, and what would make a video valuable to you..." autofocus></textarea>
    <button id="searchBtn">🎯 Find Videos</button>
    <div id="pipelineStatus" class="pipeline-status"></div>
  </div>

  <div class="container">
    <section id="summary" class="summary-box hidden">
      <h3>Why these videos match your intent:</h3>
      <p id="summaryText"></p>
      <div class="export-section">
        <label for="userNotes" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">Your quality observations (optional):</label>
        <textarea id="userNotes" placeholder="Add notes about which results were actually good, what patterns you notice, etc..."></textarea>
        <button id="exportBtn">📊 Export Results for Analysis</button>
      </div>
    </section>

    <section id="player" class="player hidden">
      <h3 id="playerTitle">Playing:</h3>
      <iframe id="playerFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      <div class="player-fallback">
        Video not loading? <a id="watchOnYT" href="#" target="_blank" rel="noopener">Watch on YouTube</a>
      </div>
    </section>

    <section id="results" class="results"></section>
    
    <div id="toggleContainer" class="toggle-all hidden">
      <button id="toggleAll">Show all 50 results</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <footer class="api-setup">
    <div class="api-key-row">
      <label for="ytApiKey">YouTube API Key (stored locally):</label>
      <input type="password" id="ytApiKey" placeholder="YouTube Data API v3 key">
      <button id="saveYtKey">Save</button>
    </div>
    <div class="api-key-row">
      <label for="openaiApiKey">OpenAI API Key (stored locally):</label>
      <input type="password" id="openaiApiKey" placeholder="OpenAI API key (uses gpt-4o-mini)">
      <button id="saveOpenAiKey">Save</button>
    </div>
    <div class="status">
      Need keys? 
      <a class="quiet-link" href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a> • 
      <a class="quiet-link" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">OpenAI API Keys</a>
    </div>
  </footer>

  <script>
    // === CONFIGURATION ===
    const CONFIG = {
      youtubeApiBase: "https://www.googleapis.com/youtube/v3/search",
      openaiApiBase: "https://api.openai.com/v1/chat/completions",
      openaiModel: "gpt-5-nano", // Change to "gpt-5-nano" if that's the correct model name
      maxResults: 50,
      topResultsToShow: 5
    };

    // === PROMPTS (easily editable) ===
    const PROMPTS = {
      translate: `You are a YouTube search query optimizer. The user has given you a detailed, verbose description of what they're looking for. 

Your task:
1. Extract the core concepts and key terms
2. Generate an optimized YouTube search query (3-8 words max)
3. Return a JSON object with EXACTLY this structure:
{
  "query": "optimized search string here",
  "keyConcepts": ["concept1", "concept2", "concept3"]
}

User's description: {{USER_INPUT}}

CRITICAL: Return ONLY the JSON object above, with no markdown, no code fences, no explanations. Just pure JSON.`,

      classify: `You are evaluating YouTube search results for quality and relevance.

Original user intent: {{USER_INPUT}}
Key concepts to match: {{KEY_CONCEPTS}}

For each video, evaluate:
- NEGATIVE signals (clickbait titles, engagement farming, shallow content indicators)
- POSITIVE signals (information density, depth, substantive titles, educational markers)
- RELEVANCE to key concepts (pattern matching to user's intent)

Return a JSON array with EXACTLY this structure:
[
  {
    "videoId": "abc123",
    "score": 85,
    "reasoning": "Brief explanation here"
  }
]

Videos to evaluate:
{{VIDEOS}}

CRITICAL: Return ONLY the JSON array above, with no markdown, no code fences, no explanations. Just pure JSON.`,

      rank: `You are producing a final ranked list and summary for the user.

Original user request: {{USER_INPUT}}

You have scored videos. Now:
1. Select the top {{TOP_N}} videos by score
2. Write a 2-3 sentence summary explaining HOW these videos match the user's intent
3. Return JSON with EXACTLY this structure:
{
  "summary": "Your 2-3 sentence explanation here",
  "ranked": [
    {
      "videoId": "abc123",
      "score": 95,
      "reasoning": "Why this video matches"
    }
  ]
}

Scored videos:
{{SCORED_VIDEOS}}

CRITICAL: Return ONLY the JSON object above, with no markdown, no code fences, no explanations. Just pure JSON.`
    };

    // === DOM ELEMENTS ===
    const els = {
      query: document.getElementById("query"),
      searchBtn: document.getElementById("searchBtn"),
      pipelineStatus: document.getElementById("pipelineStatus"),
      summary: document.getElementById("summary"),
      summaryText: document.getElementById("summaryText"),
      userNotes: document.getElementById("userNotes"),
      exportBtn: document.getElementById("exportBtn"),
      results: document.getElementById("results"),
      status: document.getElementById("status"),
      player: document.getElementById("player"),
      playerTitle: document.getElementById("playerTitle"),
      playerFrame: document.getElementById("playerFrame"),
      watchOnYT: document.getElementById("watchOnYT"),
      toggleContainer: document.getElementById("toggleContainer"),
      toggleAll: document.getElementById("toggleAll"),
      ytApiKey: document.getElementById("ytApiKey"),
      saveYtKey: document.getElementById("saveYtKey"),
      openaiApiKey: document.getElementById("openaiApiKey"),
      saveOpenAiKey: document.getElementById("saveOpenAiKey")
    };

    // === STATE ===
    let allVideos = [];
    let rankedVideos = [];
    let showingAll = false;
    let searchData = null; // Store complete search data for export

    // === UTILITY FUNCTIONS ===
    function setStatus(msg) {
      els.status.textContent = msg || "";
    }

    function setPipelineStatus(msg) {
      els.pipelineStatus.textContent = msg || "";
    }

    function formatDate(iso) {
      if (!iso) return "Unknown date";
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function getYtKey() {
      return localStorage.getItem("yt_api_key") || "";
    }

    function getOpenAiKey() {
      return localStorage.getItem("openai_api_key") || "";
    }

    function saveYtKey() {
      const key = els.ytApiKey.value.trim();
      if (key) {
        localStorage.setItem("yt_api_key", key);
        setStatus("YouTube API key saved.");
      } else {
        localStorage.removeItem("yt_api_key");
        setStatus("YouTube API key cleared.");
      }
    }

    function saveOpenAiKey() {
      const key = els.openaiApiKey.value.trim();
      if (key) {
        localStorage.setItem("openai_api_key", key);
        setStatus("OpenAI API key saved.");
      } else {
        localStorage.removeItem("openai_api_key");
        setStatus("OpenAI API key cleared.");
      }
    }

    // === LLM CALLS ===
    function extractJSON(text) {
      // Try to extract JSON from markdown code fences or mixed content
      const fenceMatch = text.match(/```(?:json)?\s*\n?([\s\S]*?)\n?```/);
      if (fenceMatch) {
        return fenceMatch[1].trim();
      }
      
      // Try to find JSON object/array boundaries
      const jsonMatch = text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
      if (jsonMatch) {
        return jsonMatch[1].trim();
      }
      
      // Return as-is if no extraction needed
      return text.trim();
    }

    async function callOpenAI(prompt) {
      const key = getOpenAiKey();
      if (!key) throw new Error("OpenAI API key not set");

      const response = await fetch(CONFIG.openaiApiBase, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${key}`
        },
        body: JSON.stringify({
          model: CONFIG.openaiModel,
          messages: [{ role: "user", content: prompt }],
          temperature: 1
        })
      });

      if (!response.ok) {
        const error = await response.text();
        throw new Error(`OpenAI API error: ${error}`);
      }

      const data = await response.json();
      const content = data.choices[0].message.content.trim();
      
      // Extract and parse JSON response
      const jsonText = extractJSON(content);
      
      try {
        return JSON.parse(jsonText);
      } catch (e) {
        console.error("Failed to parse JSON:", jsonText);
        throw new Error(`LLM returned invalid JSON: ${e.message}. Response was: ${content.substring(0, 200)}...`);
      }
    }

    // === YOUTUBE API ===
    async function fetchYouTubeResults(query) {
      const key = getYtKey();
      if (!key) throw new Error("YouTube API key not set");

      const params = new URLSearchParams({
        part: "snippet",
        type: "video",
        maxResults: CONFIG.maxResults.toString(),
        q: query,
        key: key
      });

      const response = await fetch(`${CONFIG.youtubeApiBase}?${params.toString()}`);
      if (!response.ok) {
        throw new Error(`YouTube API error: ${response.status}`);
      }

      const data = await response.json();
      return data.items || [];
    }

    // === PIPELINE ===
    async function runPipeline() {
      const userInput = els.query.value.trim();
      if (!userInput) {
        setStatus("Please describe what you're looking for.");
        return;
      }

      const ytKey = getYtKey();
      const openaiKey = getOpenAiKey();
      
      if (!ytKey) {
        setStatus("Please add your YouTube API key first.");
        return;
      }
      
      if (!openaiKey) {
        setStatus("Please add your OpenAI API key first.");
        return;
      }

      els.searchBtn.disabled = true;
      els.summary.classList.add("hidden");
      els.results.innerHTML = "";
      els.toggleContainer.classList.add("hidden");
      setStatus("");

      try {
        // STAGE 1: Query Translation
        setPipelineStatus("🧠 Stage 1/4: Translating your intent into search query...");
        const translationPrompt = PROMPTS.translate.replace("{{USER_INPUT}}", userInput);
        const translation = await callOpenAI(translationPrompt);
        const optimizedQuery = translation.query;
        const keyConcepts = translation.keyConcepts;

        setPipelineStatus(`🔍 Stage 2/4: Searching YouTube for "${optimizedQuery}"...`);
        
        // STAGE 2: Fetch
        allVideos = await fetchYouTubeResults(optimizedQuery);
        
        if (allVideos.length === 0) {
          setStatus("No results found. Try a different description.");
          setPipelineStatus("");
          els.searchBtn.disabled = false;
          return;
        }

        // STAGE 3: Classification
        setPipelineStatus(`🎯 Stage 3/4: Evaluating ${allVideos.length} videos for quality and relevance...`);
        
        const videosForLLM = allVideos.map(v => ({
          videoId: v.id.videoId,
          title: v.snippet.title,
          channel: v.snippet.channelTitle,
          description: v.snippet.description.substring(0, 300),
          publishedAt: v.snippet.publishedAt
        }));

        const classifyPrompt = PROMPTS.classify
          .replace("{{USER_INPUT}}", userInput)
          .replace("{{KEY_CONCEPTS}}", JSON.stringify(keyConcepts))
          .replace("{{VIDEOS}}", JSON.stringify(videosForLLM));

        const scored = await callOpenAI(classifyPrompt);

        // STAGE 4: Ranking
        setPipelineStatus("📊 Stage 4/4: Ranking and summarizing results...");
        
        const rankPrompt = PROMPTS.rank
          .replace("{{USER_INPUT}}", userInput)
          .replace("{{TOP_N}}", CONFIG.topResultsToShow.toString())
          .replace("{{SCORED_VIDEOS}}", JSON.stringify(scored));

        const final = await callOpenAI(rankPrompt);

        // Store complete search data for export
        searchData = {
          timestamp: new Date().toISOString(),
          userQuery: userInput,
          optimizedQuery: optimizedQuery,
          keyConcepts: keyConcepts,
          summary: final.summary,
          allResults: allVideos.map(v => ({
            videoId: v.id.videoId,
            title: v.snippet.title,
            channel: v.snippet.channelTitle,
            description: v.snippet.description,
            publishedAt: v.snippet.publishedAt,
            thumbnails: v.snippet.thumbnails
          })),
          scoredResults: scored,
          rankedResults: final.ranked
        };

        // Display results
        rankedVideos = final.ranked;
        displaySummary(final.summary);
        displayResults(false);
        
        setPipelineStatus("✅ Complete! Showing top matches.");
        setTimeout(() => setPipelineStatus(""), 3000);

      } catch (err) {
        setStatus(`Error: ${err.message}`);
        setPipelineStatus("");
        console.error(err);
      } finally {
        els.searchBtn.disabled = false;
      }
    }

    // === DISPLAY ===
    function displaySummary(text) {
      els.summaryText.textContent = text;
      els.summary.classList.remove("hidden");
    }

    function displayResults(showAll) {
      els.results.innerHTML = "";
      showingAll = showAll;

      const videosToShow = showAll ? allVideos.map((v, idx) => {
        const scored = rankedVideos.find(r => r.videoId === v.id.videoId);
        return {
          video: v,
          rank: scored ? rankedVideos.indexOf(scored) + 1 : idx + 1,
          reasoning: scored ? scored.reasoning : "Not in top matches"
        };
      }) : rankedVideos.map((r, idx) => {
        const video = allVideos.find(v => v.id.videoId === r.videoId);
        return {
          video: video,
          rank: idx + 1,
          reasoning: r.reasoning
        };
      });

      videosToShow.forEach(item => {
        if (!item.video) return;
        
        const v = item.video;
        const snippet = v.snippet;
        const videoId = v.id.videoId;

        const wrapper = document.createElement("article");
        wrapper.className = "result";

        const rank = document.createElement("span");
        rank.className = "result-rank";
        rank.textContent = `#${item.rank}`;

        const titleEl = document.createElement("h2");
        titleEl.className = "result-title";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = snippet.title;
        btn.addEventListener("click", () => playVideo(videoId, snippet.title));

        titleEl.appendChild(btn);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${snippet.channelTitle} • ${formatDate(snippet.publishedAt)}`;

        const reasoning = document.createElement("div");
        reasoning.className = "reasoning";
        reasoning.textContent = `💡 ${item.reasoning}`;

        const desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = snippet.description || "No description.";

        wrapper.appendChild(rank);
        wrapper.appendChild(titleEl);
        wrapper.appendChild(meta);
        wrapper.appendChild(reasoning);
        wrapper.appendChild(desc);

        els.results.appendChild(wrapper);
      });

      // Toggle button
      if (allVideos.length > CONFIG.topResultsToShow) {
        els.toggleContainer.classList.remove("hidden");
        els.toggleAll.textContent = showAll ? "Show top matches only" : `Show all ${allVideos.length} results`;
      }
    }

    function playVideo(videoId, title) {
      els.playerFrame.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
      els.playerTitle.textContent = `Playing: ${title}`;
      els.watchOnYT.href = `https://www.youtube.com/watch?v=${videoId}`;
      els.player.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // === EXPORT ===
    function exportResults() {
      if (!searchData) {
        alert("No search results to export. Run a search first.");
        return;
      }

      const exportData = {
        ...searchData,
        userNotes: els.userNotes.value.trim(),
        exportedAt: new Date().toISOString()
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `intentional-youtube-${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus("Results exported! Check your downloads folder.");
    }

    // === EVENT LISTENERS ===
    els.searchBtn.addEventListener("click", runPipeline);
    els.query.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        runPipeline();
      }
    });

    els.toggleAll.addEventListener("click", () => {
      displayResults(!showingAll);
    });

    els.exportBtn.addEventListener("click", exportResults);

    els.saveYtKey.addEventListener("click", saveYtKey);
    els.saveOpenAiKey.addEventListener("click", saveOpenAiKey);

    // Load saved keys
    els.ytApiKey.value = getYtKey();
    els.openaiApiKey.value = getOpenAiKey();
  </script>
</body>
</html>
